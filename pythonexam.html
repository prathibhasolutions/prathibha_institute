<!-- Full HTML for Python Exam -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>Python Exam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 40px;
      margin-bottom: 50px;
    }
    .mcq-card {
      margin-bottom: 20px;
    }
    .correct {
      border-left: 5px solid #198754 !important;
      background-color: #d1e7dd;
    }
    .wrong {
      border-left: 5px solid #dc3545 !important;
      background-color: #f8d7da;
    }
    #result {
      margin-top: 30px;
    }
    .programming-section {
      margin-top: 50px;
    }
    .header {
      background-color: rgb(23, 41, 84);
      background-position: center;
      background-size: cover;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }
    @media (max-width: 768px) {
      .header {
        justify-content: center;
      }
    }
    #footer {
      background-color: rgb(23, 41, 84);
      color: #ffffff;
      padding: 10px 0;
    }
    #userName {
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% {
        border-color: red;
        box-shadow: 0 0 8px red;
      }
      50% {
        border-color: transparent;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <section class="header" style="font-family: sans-serif; color: rgb(23, 41, 84);">
    <nav>
      <img src="logo.png" alt="" class="logo" />
    </nav>
  </section>
  <br><br><br><br><br><br><br>
  <div class="container">
    <h1 class="text-center text-success mb-4">Python MCQs and Programming Questions</h1>
    <form id="quizForm">
      <h2 class="text-danger text-center">Multiple Choice Questions (MCQs)</h2>
      <div id="mcq-container" class="mt-3"></div>
      <div class="text-center">
        <button type="button" class="btn btn-primary px-5 mt-3" onclick="checkAnswers()">Submit</button>
      </div>
      <div id="result" class="alert alert-info text-center mt-4 d-none"></div>

      <div class="programming-section">
        <h2 class="text-danger text-center">Programming Questions with Example Outputs</h2><br>
        <ol class="list-group list-group-numbered mt-3" id="programming-questions"></ol>
      </div>
    </form>
  </div>

  <script>
    const questions = [
      { question: "Which keyword is used to define a function in Python?", options: ["def", "function", "fun", "define"], answer: "def" },
      { question: "What will be the output of: print(type([]))?", options: ["<class 'list'>", "<list>", "list", "<class 'array'>"], answer: "<class 'list'>" },
      { question: "Which operator is used for exponentiation in Python?", options: ["^", "**", "//", "%%"], answer: "**" },
      { question: "How do you insert comments in Python code?", options: ["/* comment */", "// comment", "# comment", "<!-- comment -->"], answer: "# comment" },
      { question: "What does the 'len()' function return?", options: ["The last index", "The size of a variable", "The length of an object", "The type of a variable"], answer: "The length of an object" },
      { question: "What will be the output of: print(10 // 3)?", options: ["3", "3.33", "3.0", "Error"], answer: "3" },
      { question: "Which of the following is a mutable data type?", options: ["tuple", "str", "list", "int"], answer: "list" },
      { question: "Which method is used to add an element to a list?", options: ["add()", "insert()", "append()", "push()"], answer: "append()" },
      { question: "What is the result of 'bool(0)' in Python?", options: ["True", "False", "0", "None"], answer: "False" },
      { question: "What will be the output of: print('Hello' + str(5))?", options: ["Hello5", "Error", "Hello 5", "5Hello"], answer: "Hello5" }
    ];

    const programmingQuestions = [
      "Write a Python program to find the factorial of a number using recursion. Input: 5 → Output: 120",
      "Write a Python function to count the number of vowels in a string. Input: 'education' → Output: 5",
      "Create a function to check whether a number is prime or not. Input: 11 → Output: True",
      "Write a program to reverse a string without using reversed() or [::-1].",
      "Write a function that returns the maximum value in a list without using max().",
      "Write a Python program to find the second largest number in a list.",
      "Write a function to check if a string is a palindrome. Input: 'madam' → Output: True",
      "Write a Python script to print Fibonacci series up to n terms.",
      "Write a program that accepts a string and calculates the number of uppercase and lowercase letters.",
      "Write a function to merge two dictionaries into one."
    ];

    const container = document.getElementById('mcq-container');
    questions.forEach((q, index) => {
      const card = document.createElement('div');
      card.className = 'card mcq-card';
      card.innerHTML = `
        <div class="card-body">
          <p class="card-text fw-semibold">${q.question}</p>
          ${q.options.map(opt => `
            <div class="form-check">
              <input class="form-check-input" type="radio" name="q${index}" value="${opt}" id="q${index}-${opt}">
              <label class="form-check-label" for="q${index}-${opt}">${opt}</label>
            </div>`).join('')}
        </div>`;
      container.appendChild(card);
    });

    function checkAnswers() {
      let score = 0;
      const resultDiv = document.getElementById("result");
      const cards = document.querySelectorAll(".mcq-card");

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const card = cards[i];
        card.classList.remove("correct", "wrong");

        if (selected) {
          if (selected.value === q.answer) {
            score++;
            card.classList.add("correct");
          } else {
            card.classList.add("wrong");
          }
        } else {
          card.classList.add("wrong");
        }
      });

      resultDiv.classList.remove("d-none");
      resultDiv.innerHTML = `<strong>Your Score:</strong> ${score} / ${questions.length}`;
    }

    const progList = document.getElementById('programming-questions');
    progList.innerHTML = programmingQuestions.map(q =>
      `<li class="list-group-item">${q}</li>`
    ).join('');
  </script>

  <footer id="footer" class="footer">
    <div class="container text-center">
      <p>&copy; 2024 Prathibha Institute. All rights reserved.</p>
      <p>Designed by <a href="https://www.prathibhasolutions.com" style="color:aquamarine;">Prathibha Solutions</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
