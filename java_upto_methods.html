<!-- Full HTML for Java Exam -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>Java Exam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 40px;
      margin-bottom: 50px;
    }
    .mcq-card {
      margin-bottom: 20px;
    }
    .correct {
      border-left: 5px solid #198754 !important;
      background-color: #d1e7dd;
    }
    .wrong {
      border-left: 5px solid #dc3545 !important;
      background-color: #f8d7da;
    }
    #result {
      margin-top: 30px;
    }
    .programming-section {
      margin-top: 50px;
    }
    .header {
      background-color: rgb(23, 41, 84);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }
    @media (max-width: 768px) {
      .header {
        justify-content: center;
      }
    }
    #footer {
      background-color: rgb(23, 41, 84);
      color: #ffffff;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <section class="header">
    <nav>
      <img src="logo.png" alt="" class="logo" />
    </nav>
  </section>
  <br><br><br><br><br><br><br>

  <div class="container">
    <h1 class="text-center text-success mb-4">Java MCQs and Programming Questions</h1>
    <form id="quizForm">
      <h2 class="text-danger text-center">Multiple Choice Questions (MCQs)</h2>
      <div id="mcq-container" class="mt-3"></div>
      <div class="text-center">
        <button type="button" class="btn btn-primary px-5 mt-3" onclick="checkAnswers()">Submit</button>
      </div>
      <div id="result" class="alert alert-info text-center mt-4 d-none"></div>

      <div class="programming-section">
        <h2 class="text-danger text-center">Programming Questions with Example Outputs</h2><br>
        <ol class="list-group list-group-numbered mt-3" id="programming-questions"></ol>
      </div>
    </form>
  </div>

  <script>
    const questions = [
      { question: "Which data type is used to store a 64-bit integer in Java?", options: ["int", "float", "long", "double"], answer: "long" },
      { question: "What is the output of: System.out.println(10 + 20 + \"30\")?", options: ["102030", "3030", "3020", "3030"], answer: "3030" },
      { question: "Which keyword is used to define a method in Java?", options: ["function", "def", "method", "void"], answer: "void" },
      { question: "What is the default value of a boolean variable in Java?", options: ["true", "false", "null", "0"], answer: "false" },
      { question: "Which of the following is a valid method declaration in Java?", options: ["int fun()", "fun int()", "function int fun()", "declare int fun"], answer: "int fun()" },
      { question: "What is the result of this code: System.out.println(5/2);", options: ["2", "2.5", "2.0", "Error"], answer: "2" },
      { question: "Which loop ensures at least one execution before checking condition?", options: ["for", "while", "do-while", "foreach"], answer: "do-while" },
      { question: "Which keyword is used to stop the execution of a loop?", options: ["stop", "exit", "break", "halt"], answer: "break" },
      { question: "What is the index of the last element in an array of length 5?", options: ["5", "4", "0", "Undefined"], answer: "4" },
      { question: "What does this method return: public static int sum(int a, int b) { return a + b; }", options: ["String", "void", "int", "float"], answer: "int" }
    ];

    const programmingQuestions = [
      "Write a Java method to calculate factorial using recursion. Input: 4 → Output: 24",
      "Write a method to print all prime numbers in a given range. Input: 10-20 → Output: 11, 13, 17, 19",
      "Write a Java program to find the second largest element in an integer array.",
      "Create a method that returns the reverse of a given string. Input: 'Java' → Output: 'avaJ'",
      "Write a program to print Fibonacci series up to n terms using recursion.",
      "Write a method to check whether a number is even without using modulus (%) operator.",
      "Write a program to count total vowels in a string using loop and condition.",
      "Create a method that takes two numbers and returns their GCD (Greatest Common Divisor).",
      "Write a Java method to convert Celsius to Fahrenheit.",
      "Write a program to count number of digits in an integer. Input: 12345 → Output: 5"
    ];

    const container = document.getElementById('mcq-container');
    questions.forEach((q, index) => {
      const card = document.createElement('div');
      card.className = 'card mcq-card';
      card.innerHTML = `
        <div class="card-body">
          <p class="card-text fw-semibold">${q.question}</p>
          ${q.options.map(opt => `
            <div class="form-check">
              <input class="form-check-input" type="radio" name="q${index}" value="${opt}" id="q${index}-${opt}">
              <label class="form-check-label" for="q${index}-${opt}">${opt}</label>
            </div>`).join('')}
        </div>`;
      container.appendChild(card);
    });

    function checkAnswers() {
      let score = 0;
      const resultDiv = document.getElementById("result");
      const cards = document.querySelectorAll(".mcq-card");

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const card = cards[i];
        card.classList.remove("correct", "wrong");

        if (selected) {
          if (selected.value === q.answer) {
            score++;
            card.classList.add("correct");
          } else {
            card.classList.add("wrong");
          }
        } else {
          card.classList.add("wrong");
        }
      });

      resultDiv.classList.remove("d-none");
      resultDiv.innerHTML = `<strong>Your Score:</strong> ${score} / ${questions.length}`;
    }

    const progList = document.getElementById('programming-questions');
    progList.innerHTML = programmingQuestions.map(q =>
      `<li class="list-group-item">${q}</li>`
    ).join('');
  </script>

  <footer id="footer" class="footer">
    <div class="container text-center">
      <p>&copy; 2024 Prathibha Institute. All rights reserved.</p>
      <p>Designed by <a href="https://www.prathibhasolutions.com" style="color:aquamarine;">Prathibha Solutions</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
