<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>Java Exam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f8f9fa; }
    .container { margin-top: 40px; margin-bottom: 50px; }
    .mcq-card { margin-bottom: 20px; }
    .correct { border-left: 5px solid #198754 !important; background-color: #d1e7dd; }
    .wrong { border-left: 5px solid #dc3545 !important; background-color: #f8d7da; }
    #result { margin-top: 30px; }
    .programming-section { margin-top: 50px; }
    .header {
      background-color: rgb(23, 41, 84);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }
    .logo { width: 100px; height: 100px; border-radius: 50%; }
    @media (max-width: 768px) { .header { justify-content: center; } }
    #footer {
      background-color: rgb(23, 41, 84);
      color: #ffffff;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <section class="header">
    <nav>
      <img src="logo.png" alt="" class="logo" />
    </nav>
  </section>
  <br><br><br><br><br><br><br>

  <div class="container">
    <h1 class="text-center text-success mb-4">Java MCQs and Programming Questions</h1>
    <form id="quizForm">
      <h2 class="text-danger text-center">Multiple Choice Questions (MCQs)</h2>
      <div id="mcq-container" class="mt-3"></div>
      <div class="text-center">
        <button type="button" class="btn btn-primary px-5 mt-3" onclick="checkAnswers()">Submit</button>
      </div>
      <div id="result" class="alert alert-info text-center mt-4 d-none"></div>

      <div class="programming-section">
        <h2 class="text-danger text-center">Programming Questions with Example Outputs</h2><br>
        <ol class="list-group list-group-numbered mt-3" id="programming-questions"></ol>
      </div>
    </form>
  </div>

  <script>
    const questions = [
      { question: "Which keyword is used to declare a variable in Java?", options: ["int", "var", "let", "dim"], answer: "int" },
      { question: "What is the output of: System.out.println(3 > 2);", options: ["true", "false", "error", "3>2"], answer: "true" },
      { question: "Which control structure is used for decision making?", options: ["for", "while", "if", "loop"], answer: "if" },
      { question: "What is the default value of an int variable?", options: ["null", "0", "undefined", "1"], answer: "0" },
      { question: "Which loop runs zero or more times depending on condition?", options: ["for", "do-while", "if", "goto"], answer: "for" },
      { question: "Which loop checks the condition at the end?", options: ["for", "while", "do-while", "nested loop"], answer: "do-while" },
      { question: "Which operator is used for 'equal to' in Java?", options: ["=", "==", "!=", ":="], answer: "==" },
      { question: "Which loop is suitable for printing a triangle pattern?", options: ["if", "while", "for", "switch"], answer: "for" },
      { question: "What is the output of: System.out.println(5 % 2);", options: ["1", "2", "0", "5"], answer: "1" },
      { question: "Which of these is a valid nested loop?", options: ["for(for)", "while(for)", "for-inside-for", "loop-in-loop"], answer: "for-inside-for" }
    ];

    const programmingQuestions = [
      "Write a program to print numbers from 1 to 10 using a loop.",
      "Write a Java program to check whether a number is even or odd using if-else. Input: 7 → Output: Odd",
      "Print multiplication table of a number. Input: 5 → Output: 5 10 15 ... 50",
      "Write a program to print sum of first n natural numbers. Input: 5 → Output: 15",
      "Write a program to print all even numbers between 1 and 20.",
      "Write a program to find the largest of 3 numbers using if-else.",
      "Print the following pattern using nested loops: \n* \n* * \n* * *",
      "Write a program to check if a number is a palindrome. Input: 121 → Output: Palindrome",
      "Print the sum of digits of a number. Input: 123 → Output: 6",
      "Print a square pattern using stars. Input: 3 → Output: \n*** \n*** \n***"
    ];

    const container = document.getElementById('mcq-container');
    questions.forEach((q, index) => {
      const card = document.createElement('div');
      card.className = 'card mcq-card';
      card.innerHTML = `
        <div class="card-body">
          <p class="card-text fw-semibold">${q.question}</p>
          ${q.options.map(opt => `
            <div class="form-check">
              <input class="form-check-input" type="radio" name="q${index}" value="${opt}" id="q${index}-${opt}">
              <label class="form-check-label" for="q${index}-${opt}">${opt}</label>
            </div>`).join('')}
        </div>`;
      container.appendChild(card);
    });

    function checkAnswers() {
      let score = 0;
      const resultDiv = document.getElementById("result");
      const cards = document.querySelectorAll(".mcq-card");

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const card = cards[i];
        card.classList.remove("correct", "wrong");

        if (selected) {
          if (selected.value === q.answer) {
            score++;
            card.classList.add("correct");
          } else {
            card.classList.add("wrong");
          }
        } else {
          card.classList.add("wrong");
        }
      });

      resultDiv.classList.remove("d-none");
      resultDiv.innerHTML = `<strong>Your Score:</strong> ${score} / ${questions.length}`;
    }

    const progList = document.getElementById('programming-questions');
    progList.innerHTML = programmingQuestions.map(q =>
      `<li class="list-group-item">${q.replace(/\n/g, "<br>")}</li>`
    ).join('');
  </script>

  <footer id="footer" class="footer">
    <div class="container text-center">
      <p>&copy; 2024 Prathibha Institute. All rights reserved.</p>
      <p>Designed by <a href="https://www.prathibhasolutions.com" style="color:aquamarine;">Prathibha Solutions</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
