// --- Topic Navigation
function renderTopicNav() {
    let html = '';
    Object.keys(mcqs).forEach(t => {
        html += `<button class="btn btn-outline-dark btn-sm" onclick="selectTopic('${t.replace(/'/g,"&#39;")}')">${t}</button>`;
    });
    document.querySelector('.topic-nav').innerHTML = html;
}

// --- Show all questions for chosen topic
function selectTopic(topic) {
    window.currentTopic = topic;
    document.getElementById('topic-title').textContent = topic;
    renderQuestionsForTopic(topic);
}

// --- Render all questions and options
function renderQuestionsForTopic(topic) {
    const questions = mcqs[topic];
    let html = '';
    questions.forEach((qObj, qIdx) => {
        html += `
            <div class="mb-4 pb-2 border-bottom">
                <div class="mb-2"><b>Q${qIdx+1}: ${qObj.question}</b></div>
                <div id="options-${qIdx}">
                    ${qObj.options.map((opt, oIdx) => `
                        <div class="form-check">
                            <input type="radio" class="form-check-input mcq-option" 
                                name="mcq-${qIdx}" 
                                id="q${qIdx}-opt${oIdx}" 
                                value="${oIdx}">
                            <label class="form-check-label" for="q${qIdx}-opt${oIdx}">${opt}</label>
                        </div>
                    `).join('')}
                </div>
                <button class="btn btn-primary btn-sm mt-2" onclick="showAnswer(${qIdx})" id="show-answer-btn-${qIdx}">Show Answer</button>
                <div id="answer-explanation-${qIdx}" style="display:none" class="answer-explanation mt-2"></div>
            </div>
        `;
    });
    document.getElementById('question-container').innerHTML = html;
}

// --- Reveals answer for a particular question when Show Answer is clicked
window.showAnswer = function(qIdx) {
    const selected = document.querySelector(`input[name="mcq-${qIdx}"]:checked`);
    if (!selected) {
        alert('Please select an option!');
        return;
    }
    const userSelected = parseInt(selected.value, 10);
    const qObj = mcqs[window.currentTopic][qIdx];
    const isCorrect = (userSelected === qObj.answer);
    const msg = isCorrect ? 
        `<b>Correct!</b> The answer is: ${qObj.options[qObj.answer]}` :
        `<b>Incorrect.</b> Correct answer: <b>${qObj.options[qObj.answer]}</b>`;
    const ansDiv = document.getElementById(`answer-explanation-${qIdx}`);
    ansDiv.innerHTML = msg;
    ansDiv.style.display = 'block';
    document.getElementById(`show-answer-btn-${qIdx}`).disabled = true;
}

// --- App start
window.onload = function() {
    renderTopicNav();
    selectTopic(Object.keys(mcqs)[0]);
};
