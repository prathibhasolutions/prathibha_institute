<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCQ Exam - Maths, Physics, Chemistry</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fafbfc;
  }
  .topbar {
    background: #24292f;
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .topbar h2 {
    margin: 0;
    font-weight: normal;
  }
  .section-tabs {
    display: flex;
    justify-content: center;
    margin: 10px 0 0 0;
    gap: 8px;
  }
  .section-tab {
    padding: 8px 18px;
    border: none;
    border-radius: 6px 6px 0 0;
    background: #e1e4e8;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
  }
  .section-tab.active {
    background: white;
    border-bottom: 2px solid #238636;
  }
  .main {
    max-width: 1200px;
    margin: 30px auto;
    display: flex;
    gap: 15px;
  }
  .sidebar {
    min-width: 210px;
    background: white;
    padding: 18px 18px 18px 18px;
    border: 1px solid #ddd;
    border-radius: 10px 0 0 10px;
    box-shadow: 1px 3px 10px rgba(200, 200, 200, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sidebar h4 {
    margin: 0 0 12px 0;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(5, 36px);
    gap: 8px 10px;
  }
  .pal-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: #e1e4e8;
    font-weight: bold;
    color: #232323;
    font-size: 16px;
    transition: background 0.15s;
  }
  .pal-btn.unseen {
    background: white;
    color: #232323;
    border: 1px solid #ccc;
  }
  .pal-btn.visited {
    background: #ff4d4f; /* bright red */
    color: white;
  }
  .pal-btn.answered {
    background: #52c41a; /* green */
    color: white;
  }
  .pal-btn.review {
    background: #722ed1; /* purple */
    color: white;
  }
  .legend {
    margin-top: 18px;
    width: 160px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .legend-circle {
    display: inline-block;
    width: 20px;
    height: 20px;
    margin-right: 8px;
    border-radius: 50%;
    border: 1px solid #cfd8dc;
  }
  .legend-circle.unseen {
    background: white;
    border: 1px solid #ccc;
  }
  .legend-circle.visited {
    background: #ff4d4f;
  }
  .legend-circle.answered {
    background: #52c41a;
  }
  .legend-circle.review {
    background: #722ed1;
  }
  .submit-button {
    margin-top: 25px;
    padding: 10px 20px;
    font-weight: bold;
    background: #d73a49;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    font-size: 16px;
    transition: background 0.2s;
  }
  .submit-button:hover:not(:disabled) {
    background: #b52d3e;
  }
  .submit-button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .content-container {
    flex-grow: 1;
    background: white;
    border-radius: 0 10px 10px 0;
    border: 1px solid #ddd;
    box-shadow: 1px 3px 10px rgba(200, 200, 200, 0.12);
    padding: 28px 36px 18px 36px;
    min-height: 620px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .q-txt {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .optlist label {
    display: block;
    background: #f6f8fa;
    margin-bottom: 10px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .optlist input[type="radio"] {
    margin-right: 12px;
    cursor: pointer;
  }
  .optlist input[type="radio"]:checked + span {
    background: #e7fbe7 !important;
  }
  .q-controls {
    margin-top: 30px;
    display: flex;
    gap: 12px;
    justify-content: flex-start;
  }
  .q-controls button {
    padding: 9px 18px;
    font-size: 15px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
    font-weight: bold;
    background: #0366d6;
    color: white;
    transition: background 0.15s;
  }
  .q-controls button.secondary {
    background: #e1e4e8;
    color: #333;
  }
  .q-controls button.review {
    background: #45a1ff;
  }
  .q-controls button:disabled {
    background: #ddd;
    color: #888;
    cursor: default;
  }
  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 1050;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 5, 10, 0.4);
  }
  .modal-content {
    background: white;
    padding: 28px;
    border-radius: 10px;
    width: 360px;
    margin: 180px auto 0 auto;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.17);
    text-align: center;
  }
  .modal-content h3 {
    margin-top: 0;
  }
  .modal-content button {
    margin: 12px 10px 0 10px;
    padding: 10px 24px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    color: white;
  }
  .modal-content button.submit-confirm {
    background: #238636;
  }
  .modal-content button.cancel {
    background: #d73a49;
  }
  #result-summary {
    margin-top: 30px;
    overflow-x: auto;
  }
  .review-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 16px;
  }
  .review-table th,
  .review-table td {
    border: 1px solid #ccc;
    padding: 9px 12px;
  }
  .review-table th {
    background: #f0f0f0;
  }
  .correct {
    color: #13aa3f;
    font-weight: 700;
  }
  .incorrect {
    color: #d32f2f;
    font-weight: 700;
  }
  @media (max-width: 950px) {
    .main {
      flex-direction: column;
    }
    .sidebar {
      border-radius: 10px 10px 0 0;
      min-width: auto;
      width: 100%;
      display: flex;
      overflow-x: auto;
      padding: 10px;
      gap: 12px;
      box-sizing: border-box;
      justify-content: center;
    }
    .palette {
      grid-template-columns: repeat(auto-fit, 36px);
      justify-content: center;
      gap: 6px 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .content-container {
      border-radius: 0 0 10px 10px;
      margin-top: 10px;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <h2>MCQ Exam - Maths, Physics, Chemistry</h2>
  <div>
    Time Left: <span id="timer">90:00</span>
  </div>
</div>

<div class="section-tabs" id="sectionTabs">
  <button class="section-tab active" data-section="Maths" onclick="switchSection('Maths')">Maths</button>
  <button class="section-tab" data-section="Physics" onclick="switchSection('Physics')">Physics</button>
  <button class="section-tab" data-section="Chemistry" onclick="switchSection('Chemistry')">Chemistry</button>
</div>

<div class="main">
  <div class="sidebar">
    <h4>Questions</h4>
    <div class="palette" id="palette"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-circle unseen"></div> Not Visited</div>
      <div class="legend-item"><div class="legend-circle visited"></div> Not Answered</div>
      <div class="legend-item"><div class="legend-circle answered"></div> Answered</div>
      <div class="legend-item"><div class="legend-circle review"></div> Marked for Review</div>
    </div>
    <button id="globalSubmitBtn" class="submit-button" onclick="confirmSubmit()">Submit Test</button>
  </div>
  <div class="content-container">
    <div id="questionArea"></div>

    <div class="q-controls">
      <button onclick="prevQ()" id="btnPrev" class="secondary">Previous</button>
      <button onclick="saveAnswer()" id="btnSave">Save & Next</button>
      <button onclick="clearAnswer()" class="secondary">Clear</button>
      <button onclick="markForReview()" class="review">Mark for Review</button>
      <button onclick="nextQ()" id="btnNext" class="secondary">Next</button>
    </div>
    <div id="result-summary"></div>
  </div>
</div>

<!-- Modal for submit confirmation -->
<div class="modal" id="submitModal">
  <div class="modal-content">
    <h3>Submit Test?</h3>
    <p>You cannot change answers after submission.<br />Are you sure you want to submit?</p>
    <button class="submit-confirm" onclick="submitTest()">Yes, Submit</button>
    <button class="cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

    correct: 3
  }, {
    id: 'CB16',
    section: 'Chemistry',
    text: 'In B2 molecule, according to MO diagram, the bond order and magnetism is?',
    options: ['1 and paramagnetic', '2 and diamagnetic', '1 and diamagnetic', '2 and paramagnetic'],
    correct: 0
  }, {
    id: 'HB6',
    section: 'Chemistry',
    text: 'Which of the following statements is false regarding hydrogen bonding?',
    options: ['Hydrogen bonding occurs only between molecules', 'Existence of lone pair electrons is essential', 'Hydrogen bonding is strong type of dipole-dipole interaction', 'Hydrogen bond length is longer than covalent bond length'],
    correct: 0
  }, {
    id: 'FJ3',
    section: 'Chemistry',
    text: 'Which property increases the covalent character of an ionic bond according to Fajan’s rule?',
    options: ['High polarizing cation', 'Large anion size', 'High polarizability of anion', 'All of these'],
    correct: 3
  }, {
    id: 'ER4',
    section: 'Chemistry',
    text: 'Pauli\'s exclusion principle states?',
    options: ['No two electrons can have the same four quantum numbers', 'Electrons fill lowest energy levels first', 'One orbital can hold two electrons with opposite spins only', 'Electrons occupy separate orbitals before pairing'],
    correct: 0
  }, {
    id: 'ASP1',
    section: 'Chemistry',
    text: 'The wavelength of photon emitted during an electron transition from the 2nd to 1st orbit in hydrogen atom is approximately?',
    options: [ '102.6 nm','121.6 nm', '656.3 nm', '486.1 nm'],
    correct: 1
  },{
    id: 'ASP2',
    section: 'Chemistry',
    text: 'What is the energy in eV of the photon emitted when electron falls from n=3 to n=2 in hydrogen atom? (13.6 eV is the ionization energy from n=1)',
    options: [ '3.4 eV', '10.2 eV','1.89 eV', '12.1 eV'],
    correct: 2
  },{
    id: 'ASP3',
    section: 'Chemistry',
    text: 'Calculate the radius of the 3rd orbit of a hydrogen atom. (Radius of 1st orbit = 0.53 Å)',
    options: ['4.77 Å', '1.59 Å', '0.177 Å', '1.06 Å'],
    correct: 0
  },{
    id: 'ASP6',
    section: 'Chemistry',
    text: 'The de Broglie wavelength of an electron moving with velocity 3 × 10⁶ m/s (mass = 9.11 × 10⁻³¹ kg, h = 6.63 × 10⁻³⁴ Js) is approximately?',
    options: [ '1.22 × 10⁻¹⁰ m', '5.0 × 10⁻¹⁰ m', '4.5 × 10⁻¹⁰ m','2.43 × 10⁻¹⁰ m'],
    correct: 3
  },
    // Add user questions here...
  ];

  let answers = {};
  let states = {};
  questions.forEach(q => states[q.id] = 'unseen');

  let currentSection = 'Maths';
  let currentQIndex = questions.findIndex(q => q.section === currentSection);

  function renderPalette() {
    const palette = document.getElementById('palette');
    palette.innerHTML = '';
    const sectQs = questions.filter(q => q.section === currentSection);
    const startIndex = sectionStartIndex();

    sectQs.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = 'pal-btn ' + (states[q.id] || 'unseen');
      if (i === currentQIndex - startIndex) btn.classList.add('current');
      btn.textContent = i + 1;
      btn.onclick = () => showQ(startIndex + i);
      palette.appendChild(btn);
    });
  }

  function sectionStartIndex() {
    return questions.findIndex(q => q.section === currentSection);
  }
  function sectionEndIndex() {
    return questions.map(q => q.section).lastIndexOf(currentSection);
  }
  function showQ(idx) {
    currentQIndex = idx;
    renderQuestion();
    renderPalette();
  }

  function renderQuestion() {
    const q = questions[currentQIndex];
    let a = answers[q.id];
    if (states[q.id] === 'unseen') states[q.id] = 'visited';

    let html = `<div class="q-txt">${currentQIndex + 1}. ${q.text}</div>`;
    html += '<form class="optlist" id="optForm">';
    q.options.forEach((opt, i) => {
      html += `<label><input type="radio" name="option" value="${i}" id="opt${i}" ${a == i ? 'checked' : ''}><span>${opt}</span></label>`;
    });
    html += '</form>';
    document.getElementById('questionArea').innerHTML = html;

    // Enable or disable prev/next buttons for section range
    document.getElementById('btnPrev').disabled = (currentQIndex === sectionStartIndex());
    document.getElementById('btnNext').disabled = (currentQIndex === sectionEndIndex());
  }

  function prevQ() {
    if (currentQIndex > sectionStartIndex()) showQ(currentQIndex - 1);
  }
  function nextQ() {
    if (currentQIndex < sectionEndIndex()) showQ(currentQIndex + 1);
  }
  function saveAnswer() {
    const q = questions[currentQIndex];
    const form = document.getElementById('optForm');
    const sel = form.option && form.option.value !== undefined ? form.option.value : null;
    if (sel !== null) {
      answers[q.id] = parseInt(sel);
      states[q.id] = 'answered';
      if (currentQIndex < sectionEndIndex()) showQ(currentQIndex + 1);
    } else {
      alert('Please select an option to save.');
      return;
    }
    renderPalette();
  }
  function clearAnswer() {
    const q = questions[currentQIndex];
    delete answers[q.id];
    states[q.id] = 'visited';
    renderQuestion();
    renderPalette();
  }
  function markForReview() {
    const q = questions[currentQIndex];
    const form = document.getElementById('optForm');
    const sel = form.option && form.option.value !== undefined ? form.option.value : null;
    if (sel !== null) answers[q.id] = parseInt(sel);
    states[q.id] = 'review';
    renderPalette();
    if (currentQIndex < sectionEndIndex()) showQ(currentQIndex + 1);
  }
  function switchSection(section) {
    currentSection = section;
    currentQIndex = sectionStartIndex();
    document.querySelectorAll('.section-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.section === section);
    });
    renderQuestion();
    renderPalette();
  }
  function confirmSubmit() {
    document.getElementById('submitModal').style.display = 'block';
  }
  function closeModal() {
    document.getElementById('submitModal').style.display = 'none';
  }
  function submitTest() {
    closeModal();
    // Disable submit button after submission
    document.getElementById('globalSubmitBtn').disabled = true;

    const total = questions.length;
    let correct = 0, attempted = 0, incorrect = 0;

    let tableHtml = `<table class="review-table"><thead><tr><th>Q#</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Status</th></tr></thead><tbody>`;
    questions.forEach((q, i) => {
      const yourAnswerIdx = answers[q.id];
      let stat = '-';
      let rowStyle = '';
      let yourAnswerText = yourAnswerIdx !== undefined ? q.options[yourAnswerIdx] : '-';

      if (yourAnswerIdx !== undefined) {
        attempted++;
        const isRight = (yourAnswerIdx === q.correct);
        if (isRight) {
          correct++;
          stat = '<span class="correct">Correct</span>';
          rowStyle = 'style="background:#e9fbe9"';
        } else {
          incorrect++;
          stat = '<span class="incorrect">Incorrect</span>';
          rowStyle = 'style="background:#fee"';
        }
      } else {
        stat = 'Not Answered';
        rowStyle = 'style="background:#f6f8fa"';
      }
      tableHtml += `<tr ${rowStyle}>
        <td>${i + 1}</td>
        <td>${q.text}</td>
        <td>${yourAnswerText}</td>
        <td>${q.options[q.correct]}</td>
        <td>${stat}</td>
      </tr>`;
    });
    tableHtml += '</tbody></table>';

    const resultHtml = `
      <div id="result-summary">
        <h3>Exam Completed!</h3>
        <p><b>Attempted:</b> ${attempted} / ${total} &nbsp;&nbsp;
           <b>Correct:</b> ${correct} &nbsp;&nbsp;
           <b>Incorrect:</b> ${incorrect} &nbsp;&nbsp;
           <b>Score:</b> ${correct}</p>
        ${tableHtml}
        <br />
        <button onclick="location.reload()" style="padding: 8px 20px; font-weight: bold; background: #238636; color: white; border:none; border-radius: 6px; cursor: pointer;">Retake Test</button>
      </div>`;

    document.querySelector('.content-container').innerHTML = resultHtml;
    document.getElementById('result-summary').scrollIntoView({behavior:'smooth'});
  }

  // Timer logic - 90 minutes countdown
  let totalTime = 75 * 60;
  function timerTick() {
    const timerEl = document.getElementById('timer');
    if (totalTime < 0) {
      confirmSubmit();
      return;
    }
    const minutes = Math.floor(totalTime / 60);
    const seconds = totalTime % 60;
    timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    totalTime--;
    setTimeout(timerTick, 1000);
  }

  // Initial render setup
  timerTick();
  renderQuestion();
  renderPalette();
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
