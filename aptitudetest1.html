<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>General Aptitude Quiz (Easy to Medium)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #f5faff; font-family: 'Segoe UI', sans-serif; padding: 0; margin: 0; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 30px 30px 20px 30px; margin-top: 30px; border-radius: 16px; box-shadow: 0 4px 32px rgba(60,140,210,0.12);}
        h1 { color: #195197; }
        .question { font-size: 1.1em; font-weight: 600; margin-bottom: 10px; }
        .options { margin-bottom: 17px; }
        .options label { display: block; margin-bottom: 7px; }
        #submitBtn { padding: 12px 32px; background: #2186c9; color: #fff; border: none; font-size: 1.2em; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        #submitBtn:disabled { background: #c6deff; color: #aaa; }
        .results { margin-top: 30px; font-size: 1.12em; background: #eaf7ff; padding: 18px; border-radius: 9px;}
        .results span { font-weight: bold; }
        .answers-list { margin-top: 16px; }
        .answers-list p { margin: 2px 0; }
        .correct { color: #006622; }
        .incorrect { color: #d42222; }
    </style>
</head>
<body>
<div class="container">
    <h1>General Aptitude Quiz (Easy-Medium)</h1>
    <form id="quizForm">
        <!-- Questions will be injected here by JavaScript -->
    </form>
    <button id="submitBtn">Submit Quiz</button>
    <div id="results" class="results" style="display:none"></div>
</div>
<script>
const questions = [
    // Problems on Ages (10)
    {
        q: "A father is 3 times as old as his son. Twelve years ago, the father was 5 times older than his son. What is the present age of the son?",
        options: ["12", "14", "18", "16"], answer: 1 // 14
    },
    {
        q: "The sum of the ages of a father and son is 45 years. Five years ago, the father's age was twice the age of the son. The age of the father is?",
        options: ["25", "30", "35", "40"], answer: 2 // 35
    },
    {
        q: "The present age of a mother is 3 times the present age of her daughter. After 10 years, mother's age will be twice the age of the daughter. The present age of daughter is?",
        options: ["10", "15", "20", "30"], answer: 0 // 10
    },
    {
        q: "Sum of ages of A and B is 50. Five years ago, A was thrice as old as B. What is A’s present age?",
        options: ["40", "30", "35", "45"], answer: 0 // 40
    },
    {
        q: "Father's age is 4 times the age of his son. After 20 years, he will be twice as old as his son. Present age of the son?",
        options: ["20", "15", "10", "25"], answer: 2 // 10
    },
    {
        q: "A man is 24 years older than his son. In two years, his age will be twice that of his son. The son's current age is?",
        options: ["21", "22", "24", "26"], answer: 1 // 22
    },
    {
        q: "Six years ago, the ratio of ages of A and B was 6:5. Four years hence, it will be 11:10. What is B’s present age?",
        options: ["16", "14", "20", "24"], answer: 2 // 20
    },
    {
        q: "The present ages of A and B are in the ratio 5:3. After 6 years, the ratio will become 7:5. Find the present age of A.",
        options: ["24", "20", "30", "21"], answer: 2 // 30
    },
    {
        q: "Father's present age is 5 times his son's present age. Five years ago his age was seven times his son's age at that time. Find the present age of father.",
        options: ["30", "35", "40", "45"], answer: 0 // 30
    },
    {
        q: "A's age is twice B's age and half of C's age. If the sum of their ages is 42, what is A's age?",
        options: ["7", "14", "21", "28"], answer: 1 // 14
    },

    // HCF, LCM (10)
    {
        q: "Find the HCF of 18, 24 and 36.",
        options: ["2", "4", "6", "12"], answer: 2 // 6
    },
    {
        q: "Find the LCM of 8, 12 and 15.",
        options: ["120", "60", "240", "180"], answer: 0 // 120
    },
    {
        q: "LCM of two numbers is 168 and their HCF is 21. If one number is 84, find the other.",
        options: ["21", "36", "42", "63"], answer: 2 // 42
    },
    {
        q: "The HCF of two numbers is 8 and their LCM is 96. If one number is 32, find the other.",
        options: ["24", "32", "16", "48"], answer: 0 // 24
    },
    {
        q: "HCF of 45, 75, 60 is:",
        options: ["5", "15", "10", "20"], answer: 1 // 15
    },
    {
        q: "The LCM of 12 and 20 is:",
        options: ["60", "30", "12", "20"], answer: 0 // 60
    },
    {
        q: "Greatest number which divides 148 and 246 exactly is:",
        options: ["2", "4", "82", "49"], answer: 2 // 82
    },
    {
        q: "LCM of 2, 3, 4, 5, 6 is:",
        options: ["30", "60", "120", "180"], answer: 1 // 60
    },
    {
        q: "The HCF of 42 and 70 is:",
        options: ["6", "7", "14", "35"], answer: 2 // 14
    },
    {
        q: "The least common multiple of 9 and 12 is:",
        options: ["18", "36", "48", "24"], answer: 1 // 36
    },

    // Basic Trigonometry (10)
    {
        q: "What is the value of sin 30°?",
        options: ["0.5", "1", "0.866", "0"], answer: 0 // 0.5
    },
    {
        q: "What is the value of cos 0°?",
        options: ["1", "0", "0.866", "0.5"], answer: 0 // 1
    },
    {
        q: "If tan θ = 1, θ is:",
        options: ["30°", "90°", "45°", "60°"], answer: 2 // 45°
    },
    {
        q: "What is the value of sin 90°?",
        options: ["0", "1", "-1", "0.5"], answer: 1 // 1
    },
    {
        q: "Find cos 60°.",
        options: ["0", "0.5", "1", "0.866"], answer: 1 // 0.5
    },
    {
        q: "What is the value of tan 0°?",
        options: ["0", "1", "undefined", "-1"], answer: 0 // 0
    },
    {
        q: "Which one is equal to 1?",
        options: ["sin 0°", "cos 90°", "sin 90°", "tan 90°"], answer: 2 // sin 90°
    },
    {
        q: "sin²θ + cos²θ equals to?",
        options: ["2", "1", "0", "sinθ cosθ"], answer: 1 // 1
    },
    {
        q: "If sin θ = 0, θ is:",
        options: ["0°", "30°", "45°", "60°"], answer: 0 // 0°
    },
    {
        q: "What is the value of cos 90°?",
        options: ["1", "0", "0.5", "-1"], answer: 1 // 0
    },

    // Two-variable equation solving (10)
    {
        q: "Solve: 3x + 2y = 12, x + y = 4. Find x.",
        options: ["2", "3", "4", "5"], answer: 1 // 3
    },
    {
        q: "If x - y = 2 and x + y = 10, what is x?",
        options: ["4", "6", "8", "12"], answer: 1 // 6
    },
    {
        q: "Solve: x + 2y = 10, 2x + y = 13. Find y.",
        options: ["3", "4", "5", "6"], answer: 2 // 5
    },
    {
        q: "If 2x + 3y = 12 and x - y = 1, find y.",
        options: ["3", "2", "1", "0"], answer: 0 // 3
    },
    {
        q: "Solve: x + y = 7, x - y = 1. Find x.",
        options: ["3", "4", "5", "6"], answer: 1 // 4
    },
    {
        q: "Find x: 2x + y = 11, x - y = 1.",
        options: ["4", "5", "6", "7"], answer: 1 // 5
    },
    {
        q: "x + y = 8, x - y = 4. What is y?",
        options: ["2", "3", "1", "4"], answer: 0 // 2
    },
    {
        q: "If 2x = 3y and x + y = 15, find x.",
        options: ["6", "9", "10", "12"], answer: 1 // 9
    },
    {
        q: "If x - y = 8 and x + y = 20, what is x?",
        options: ["8", "10", "12", "14"], answer: 3 // 14
    },
    {
        q: "x + y = 13, x - y = 7. Find y.",
        options: ["2", "3", "5", "6"], answer: 2 // 3
    },

    // Mixed easy-medium aptitude (10)
    {
        q: "The ratio of two numbers is 3:4 and their LCM is 84. The numbers are?",
        options: ["12, 16", "24, 32", "21, 28", "42, 56"], answer: 2 // 21,28
    },
    {
        q: "If 16 is added to a number, it becomes 3 times itself. What is that number?",
        options: ["4", "5", "6", "8"], answer: 0 // 8
    },
    {
        q: "What is the value of (2² + 3² + 4²)?",
        options: ["29", "14", "25", "21"], answer: 0 // 29
    },
    {
        q: "If 9 workers finish a job in 8 days, how many days will 12 workers take?",
        options: ["6", "7", "5", "8"], answer: 0 // 6
    },
    {
        q: "The largest 2-digit prime number is:",
        options: ["97", "99", "89", "83"], answer: 0 // 97
    },
    {
        q: "If 5x = 80, then x + 2 = ?",
        options: ["14", "18", "16", "10"], answer: 2 // 18
    },
    {
        q: "If cost price is Rs. 40 and selling price is Rs. 50, find the profit %.",
        options: ["10%", "20%", "25%", "30%"], answer: 2 // 25%
    },
    {
        q: "Find the odd number out: 18, 24, 27, 36",
        options: ["18", "24", "27", "36"], answer: 2 // 27
    },
    {
        q: "The value of √81 is:",
        options: ["9", "8", "7", "6"], answer: 0 // 9
    },
    {
        q: "If the perimeter of a square is 20 cm, find its area.",
        options: ["20", "25", "16", "36"], answer: 1 // 25
    }
];

// HTML rendering
const quizForm = document.getElementById('quizForm');
questions.forEach((item, i) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'qblock';
    qDiv.innerHTML = `
        <div class="question">${i+1}. ${item.q}</div>
        <div class="options">
            ${item.options.map((opt, oi) => `
                <label>
                    <input type="radio" name="q${i}" value="${oi}" /> ${opt}
                </label>
            `).join('')}
        </div>
    `;
    quizForm.appendChild(qDiv);
});

// Logic after submit
document.getElementById('submitBtn').onclick = function(e) {
    e.preventDefault();
    let score = 0;
    let correct = 0;
    let incorrect = 0;
    const resultLines = [];
    for(let i=0; i<questions.length; i++) {
        const radios = document.getElementsByName('q'+i);
        let selected = -1;
        for(const r of radios) { if(r.checked) selected = parseInt(r.value);}
        if(selected === questions[i].answer) {
            score++;
            correct++;
            resultLines.push(`<p><span class="correct">${i+1}. Correct: ${questions[i].options[selected]}</span></p>`);
        } else {
            incorrect++;
            let selectedText = (selected===-1) ? '<i>Not Attempted</i>' : questions[i].options[selected];
            resultLines.push(`<p><span class="incorrect">${i+1}. Incorrect: Your answer: ${selectedText} | Correct: ${questions[i].options[questions[i].answer]}</span></p>`);
        }
    }
    document.getElementById('results').style.display = 'block';
    document.getElementById('results').innerHTML =
        `<div>
            <span>Total Score:</span> ${score} / ${questions.length}<br>
            <span>Correct:</span> ${correct} &nbsp; <span>Incorrect:</span> ${incorrect}
         </div>
         <div class="answers-list">
            <br><b>Detailed Answers:</b>
            ${resultLines.join('')}
         </div>`
    document.getElementById('submitBtn').disabled = true;
};
</script>
</body>
</html>
